{{ define "main" }}
  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-container">
      <div class="hero-content">
        <div class="hero-text">
          <h1 class="hero-title">
            <span class="hero-title-line2">404</span>
            <span class="hero-title-line1">페이지를 찾을 수 없습니다</span>
          </h1>
          <p class="hero-subtitle">
            요청하신 페이지가 존재하지 않거나 주소가 변경되었습니다.
          </p>
          <div class="hero-social" style="margin-top: var(--spacing-lg);">
            <a href="{{ .Site.Home.RelPermalink }}" class="post-tag">홈페이지로 돌아가기</a>
          </div>
        </div>
        <div class="hero-image">
          <img
            src="{{ "planet-favicon.png" | relURL }}"
            alt="{{ site.Title }}"
            class="hero-logo">
        </div>
      </div>
    </div>
  </section>
{{ end }}
